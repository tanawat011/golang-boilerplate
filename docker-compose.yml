# Local development stack: the API and PostgreSQL.
#   docker compose up --build
# The API listens on http://localhost:8080. PostgreSQL is published on
# 127.0.0.1:15432 (not 5432, so it never collides with a local server).
# Every value here is a development default: never reuse them in production.

services:
  api:
    build: .
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      APP_MODE: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: golang_boilerplate
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-do-not-use-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golang_boilerplate
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golang_boilerplate"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
