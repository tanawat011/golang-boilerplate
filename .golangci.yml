version: "2"

run:
  build-tags:
    - integration

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may build SQL and ignore errors on purpose.
      - path: _test\.go
        linters: [gosec, errcheck]
      - path: internal/testutil/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tanawat011/golang-boilerplate
